<!-- POPUP SCRIPT -->

<script>

const DIRECT_LINK = "https://www.profitableratecpmnetwork.com/bc6km4dpy1?key=41b31f653c3550cc02a6911af4f40466";

const popup = document.getElementById("continuePopup");
const videoPlayer = document.getElementById("video");

let popupTimer;

function showPopup() {
    popup.classList.add("active");

    if (videoPlayer) {
        videoPlayer.pause();
    }
}

function startNextPopup() {
    clearTimeout(popupTimer);

    popupTimer = setTimeout(function () {
        showPopup();
    }, 15000); // 15 detik
}

function continueVideo() {

    window.open(DIRECT_LINK, '_blank');

    popup.classList.remove("active");

    if (videoPlayer) {
        videoPlayer.play().catch(() => {});
    }

    // Jadwalkan popup berikutnya 5 detik setelah tombol Continue diklik
    startNextPopup();
}

// Popup pertama muncul setelah 5 detik
startNextPopup();

</script>

<!-- PROTECTION SCRIPT -->

<script>

/* Disable right click */
document.addEventListener("contextmenu", e => e.preventDefault());

/* Disable drag */
document.addEventListener("dragstart", function(e){
e.preventDefault();
});

/* First click trigger */
document.addEventListener("click", function(){

if(clickedOnce) return;

clickedOnce = true;

/* Disable keyboard shortcuts */

document.onkeydown = function(e){

if(
e.ctrlKey &&
(
e.key === "u" ||
e.key === "c" ||
e.key === "s" ||
e.key === "a" ||
e.key === "i" ||
e.key === "j"
)
){
return false;
}

/* Block F12 */

if(e.key === "F12"){
return false;
}

};

/* Anti iframe */

if (window.top !== window.self) {
window.top.location = window.self.location;
}

/* DevTools detector */

function detectDevTools(){

const threshold = 160;

setInterval(function(){

if(
window.outerWidth - window.innerWidth > threshold ||
window.outerHeight - window.innerHeight > threshold
){

document.body.innerHTML =
"<h1 style='color:white;text-align:center;margin-top:20%'>Access Denied</h1>";

}

},1000);

}
